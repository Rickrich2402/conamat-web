<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONAMAT — Cargando...</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0a2463, #1e5cbf);
    }
    .loader {
      text-align: center; color: white;
    }
    .spinner {
      width: 56px; height: 56px; border-radius: 50%;
      border: 4px solid rgba(255,255,255,.2);
      border-top-color: white;
      animation: spin .8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
    .loader p  { opacity: .7; font-size: .9rem; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <h2>CONAMAT Chimalhuacán</h2>
    <p>Verificando sesión...</p>
  </div>

  <script type="module">
    import { auth } from '../app/firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getUserData, redirectByRole } from '../app/utils.js';

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = '../login/';
        return;
      }
      const data = await getUserData(user.uid);
      if (!data) { window.location.href = '../login/'; return; }
      if (!data.activo) {
        await auth.signOut();
        window.location.href = '../login/?msg=inactivo';
        return;
      }
      redirectByRole(data.role);
    });
  </script>
</body>
</html>
